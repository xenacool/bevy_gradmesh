[[example]]
name = "terrain"
path = "examples/terrain.rs"
required-features = ["pbr"]

[[example]]
name = "road"
path = "examples/road.rs"
required-features = ["pbr"]

[[example]]
name = "composed_shapes"
path = "examples/composed_shapes.rs"
required-features = ["pbr"]

[[example]]
name = "standalone"
path = "examples/standalone.rs"

[[example]]
