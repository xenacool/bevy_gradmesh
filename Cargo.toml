[package]
name = "bevy_gradmesh"
version = "0.3.6"
authors = ["Jessica Collins (https://github.com/xenacool)"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Procedural shapes, mesh generation and gradient materials for Bevy"
repository = "https://github.com/xenacool/bevy_gradmesh"
readme = "README.md"
exclude = ["screenshots/", "reference/", "target/", "Cargo.lock", "Makefile", "book/"]

[profile.dev]
# Reduce codegen units to speed up incremental compilation and reduce memory usage.
# Default is the number of CPU cores (16), which increases linker memory significantly.
codegen-units = 8

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"

[features]
default = ["pbr"]
# PBR-based paths (ExtendedMaterial, instanced PBR pipeline). Disable for mobile / PBR-free builds.
pbr = ["bevy/bevy_pbr"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_render", "bevy_sprite_render", "bevy_log"] }
bevy_asset = "0.20"
bevy_material = "0.20"
bytemuck = "1.21"

# Examples need UI, text, the default font, debug overlays, tonemapping LUT textures and PNG
# support, none of which the library requires. Bevy's default features cover all of them.
[dev-dependencies]
bevy = { version = "0.20", features = ["tonemapping_luts", "png"] }

# Examples marked `required-features = ["pbr"]` draw lit 3D shapes with `GradMeshMaterial` or the
# instanced PBR pipeline, so Cargo skips them when `pbr` is off. The rest build with
# `--no-default-features`: they use the Mesh2d, SDF and standalone backends.
[[example]]
name = "character_creator"
path = "examples/character_creator.rs"
required-features = ["pbr"]

[[example]]
name = "shapes"
path = "examples/shapes.rs"
required-features = ["pbr"]

[[example]]
name = "styles"
path = "examples/styles.rs"
required-features = ["pbr"]

[[example]]
name = "mix_spaces"
path = "examples/mix_spaces.rs"

[[example]]
name = "curves"
path = "examples/curves.rs"

[[example]]
name = "immediate"
path = "examples/immediate.rs"
required-features = ["pbr"]

[[example]]
name = "polyline"
path = "examples/polyline.rs"

[[example]]
name = "instanced"
path = "examples/instanced.rs"
required-features = ["pbr"]

[[example]]
name = "pbr_effects"
path = "examples/pbr_effects.rs"
required-features = ["pbr"]

[[example]]
name = "gradient_2d"
path = "examples/gradient_2d.rs"

[[example]]
name = "sdf_2d"
path = "examples/sdf_2d.rs"

[[example]]
name = "sdf_dash_gallery"
path = "examples/sdf_dash_gallery.rs"

[[example]]
name = "sweep"
path = "examples/sweep.rs"
