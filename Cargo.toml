[package]
name = "bevy_gradmesh"
version = "0.1.8"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Procedural mesh generation and gradient materials for Bevy"
repository = "https://github.com/xenacool/bevy_gradmesh"
readme = "README.md"
exclude = ["screenshots/", "reference/", "target/", "Cargo.lock", "Makefile", "book/"]

[profile.dev]
# Reduce codegen units to speed up incremental compilation and reduce memory usage.
# Default is the number of CPU cores (16), which increases linker memory significantly.
codegen-units = 8

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_pbr", "bevy_render", "bevy_log", "bevy_text", "bevy_ui", "debug", "default_font"] }
bevy_asset = "0.20"
bevy_material = "0.20"
bytemuck = "1.21"

# Examples need tonemapping LUT textures and PNG support which the library does not require.
[dev-dependencies]
bevy = { version = "0.20", features = ["tonemapping_luts", "png"] }

[[example]]
name = "character_creator"
path = "examples/character_creator.rs"

[[example]]
name = "shapes"
path = "examples/shapes.rs"

[[example]]
name = "styles"
path = "examples/styles.rs"

[[example]]
name = "curves"
path = "examples/curves.rs"

[[example]]
name = "immediate"
path = "examples/immediate.rs"

[[example]]
name = "polyline"
path = "examples/polyline.rs"

[[example]]
name = "instanced"
path = "examples/instanced.rs"

[[example]]
name = "pbr_effects"
path = "examples/pbr_effects.rs"

[[example]]
name = "kart_racer"
path = "examples/kart_racer.rs"
